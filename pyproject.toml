[project]
name = "qf"
version = "1.0.5"
authors = []
description = "Utilities for developing QSINT python applications"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cryptography>=41.0.7",
    "Flask>=3.0.3",
    "Flask_Bcrypt>=1.0.1",
    "Flask_JWT_Extended>=4.6.0",
    "flask_restx>=1.3.0",
    "python-dotenv>=1.0.1",
    "Requests>=2.31.0",
    "flask_talisman>=1.1.0",
    "Flask_Cors>=4.0.1",

    # OpenTelemetry
    "opentelemetry-api",
    "opentelemetry-distro",
    "opentelemetry-exporter-jaeger-thrift",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-sdk",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://gitlab.dcti.ro/serviciul-osint/qsint/qsint"


# ==========================================================
# Build system
# ==========================================================

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"


# ==========================================================
# Hatch build configuration (IMPORTANT PART)
# ==========================================================

[tool.hatch.build]
# Global excludes (applies to ALL targets)
exclude = [
    # PoC / examples
    "poc_app/**",

    # Virtual environments
    "**/venv/**",
    "**/.venv/**",

    # Python junk
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",

    # Tooling caches
    ".pytest_cache/**",
    ".mypy_cache/**",
    ".ruff_cache/**",
    ".tox/**",

    # Build artifacts
    "dist/**",
    "build/**",
    "*.egg-info/**",
]


# ==========================================================
# SDIST (source distribution)
# ==========================================================

[tool.hatch.build.targets.sdist]
exclude = [
    "poc_app/**",
    "**/venv/**",
    "**/.venv/**",
]


# ==========================================================
# WHEEL (binary distribution)
# ==========================================================

[tool.hatch.build.targets.wheel]
# IMPORTANT: only package the real library code
packages = ["src/framework"]

exclude = [
    "poc_app/**",
    "**/venv/**",
    "**/.venv/**",
]
